<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Econômicos</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #0f1c3d;
}

#viewport {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

#widget {
    position: relative;

    width: 420px;
    height: 210px;

    flex-shrink: 0;

    transform-origin: center center;
}

#widget iframe {

    position: absolute;

    left: 0;
    top: 0;

    width: 420px;
    height: 210px;

    border: 0;

    display: block;
}

</style>

</head>

<body>

<div id="viewport">

    <div id="widget">

        <iframe
            src="https://valorfinal.com.br/embed/indicadores?theme=dark"
            title="Indicadores econômicos hoje - ValorFinal"
            frameborder="0"
            scrolling="no">
        </iframe>

    </div>

</div>

<script>

const widget = document.getElementById("widget");

function ajustarWidget() {

    const telaW = window.innerWidth;
    const telaH = window.innerHeight;

    const widgetW = 420;
    const widgetH = 210;

    /*
    Queremos que o widget ocupe
    praticamente toda a tela.
    */

    const margem = 0.96;

    const escalaW =
        (telaW * margem) / widgetW;

    const escalaH =
        (telaH * margem) / widgetH;

    /*
    Usa a maior escala possível sem
    ultrapassar a tela.
    */

    const escala = Math.min(
        escalaW,
        escalaH
    );

    widget.style.transform =
        "translateZ(0) scale(" + escala + ")";
}

ajustarWidget();

window.addEventListener(
    "resize",
    ajustarWidget
);

</script>

</body>
</html>
