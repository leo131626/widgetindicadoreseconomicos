<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Econômicos</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1c3d;
}

#viewport {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#zoom-container {
    position: absolute;

    width: 420px;
    height: 210px;

    left: 50%;
    top: 50%;

    transform-origin: center center;
}

iframe {
    width: 420px;
    height: 210px;

    border: 0;

    display: block;

    margin: 0;
    padding: 0;
}

</style>

</head>

<body>

<div id="viewport">

    <div id="zoom-container">

        <iframe
            src="https://valorfinal.com.br/embed/indicadores?theme=dark"
            title="Indicadores econômicos hoje - ValorFinal"
            frameborder="0"
            scrolling="no">
        </iframe>

    </div>

</div>

<script>

function ajustarTamanho() {

    const viewport = document.getElementById("viewport");
    const container = document.getElementById("zoom-container");

    const largura = viewport.clientWidth;
    const altura = viewport.clientHeight;

    const larguraOriginal = 420;
    const alturaOriginal = 210;

    /*
    Calcula quanto o widget pode crescer
    sem ultrapassar os limites da tela.
    */

    const escalaHorizontal = largura / larguraOriginal;
    const escalaVertical = altura / alturaOriginal;

    /*
    Usa a menor escala para garantir
    que nenhuma parte seja cortada.
    */

    const escala = Math.min(
        escalaHorizontal,
        escalaVertical
    ) * 0.95;

    container.style.transform =
        `translate(-50%, -50%) scale(${escala})`;
}

ajustarTamanho();

window.addEventListener("resize", ajustarTamanho);

</script>

</body>
</html>
