<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Indicadores Econômicos</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f1c3d;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            max-width: none;
            display: block;
        }
    </style>
</head>

<body>

<div class="container">

    <iframe
        src="https://valorfinal.com.br/embed/indicadores?theme=dark"
        title="Indicadores econômicos hoje - ValorFinal"
        data-valorfinal-embed
        loading="eager">
    </iframe>

</div>

<script>
(function () {

    if (window.__vfEmbed) return;

    window.__vfEmbed = 1;

    window.addEventListener("message", function (e) {

        if (e.origin !== "https://valorfinal.com.br") return;

        var d = e.data;

        if (
            !d ||
            d.type !== "valorfinal:embed-height" ||
            typeof d.height !== "number"
        ) return;

        var frames = document.querySelectorAll(
            "iframe[data-valorfinal-embed]"
        );

        for (var i = 0; i < frames.length; i++) {

            if (frames[i].contentWindow === e.source) {

                frames[i].style.height = d.height + "px";

            }

        }

    });

})();
</script>

</body>
</html>
