<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indicadores Econômicos Hoje - ValorFinal</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Tamanho original do widget (base, antes de ampliar) */
    :root {
      --vf-base-width: 420px;
      --vf-base-height: 210px;
      --vf-scale: 1.6; /* <-- ajuste este número para aumentar/diminuir */
    }

    .vf-scale-outer {
      width: calc(var(--vf-base-width) * var(--vf-scale));
      height: calc(var(--vf-base-height) * var(--vf-scale));
      max-width: 100%;
      overflow: hidden; /* corta só o excesso do zoom, não o widget em si */
    }

    .vf-scale-inner {
      width: var(--vf-base-width);
      height: var(--vf-base-height);
      transform: scale(var(--vf-scale));
      transform-origin: top left;
    }

    .vf-scale-inner iframe {
      display: block;
      width: var(--vf-base-width);
      height: var(--vf-base-height);
      border: 0;
    }

    .vf-caption {
      font: 13px sans-serif;
      margin: 6px 0 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <div class="vf-scale-outer">
      <div class="vf-scale-inner">
        <iframe
          src="https://valorfinal.com.br/embed/indicadores?theme=dark"
          title="Indicadores econômicos hoje - ValorFinal"
          data-valorfinal-embed
          loading="lazy"
        ></iframe>
      </div>
    </div>
    <p class="vf-caption">
      Indicadores econômicos hoje por
      <a href="https://valorfinal.com.br/indicadores-economicos-hoje?utm_source=embed&utm_medium=widget&utm_campaign=indicadores" target="_blank" rel="noopener">ValorFinal</a>
    </p>
  </div>

  <script>
    (function () {
      if (window.__vfEmbed) return;
      window.__vfEmbed = 1;
      window.addEventListener("message", function (e) {
        if (e.origin !== "https://valorfinal.com.br") return;
        var d = e.data;
        if (!d || d.type !== "valorfinal:embed-height" || typeof d.height !== "number") return;
        var frames = document.querySelectorAll("iframe[data-valorfinal-embed]");
        for (var i = 0; i < frames.length; i++) {
          if (frames[i].contentWindow === e.source) {
            frames[i].style.height = d.height + "px";
            // reajusta a altura do wrapper externo proporcional ao scale
            var scale = getComputedStyle(document.documentElement).getPropertyValue('--vf-scale');
            var outer = frames[i].closest('.vf-scale-outer');
            if (outer) outer.style.height = (d.height * parseFloat(scale)) + "px";
          }
        }
      });
    })();
  </script>
</body>
</html>
