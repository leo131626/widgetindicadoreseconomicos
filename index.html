<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Econômicos</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1c3d;
}

#viewport {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#zoom-container {

    /*
    Tamanho original do widget
    */
    width: 420px;
    height: 210px;

    /*
    Impede qualquer corte do conteúdo
    */
    flex-shrink: 0;

    transform-origin: center center;
}

iframe {

    width: 420px;
    height: 210px;

    border: 0;

    display: block;

    overflow: hidden;
}

</style>

</head>

<body>

<div id="viewport">

    <div id="zoom-container">

        <iframe
            src="https://valorfinal.com.br/embed/indicadores?theme=dark"
            title="Indicadores econômicos hoje - ValorFinal"
            frameborder="0"
            scrolling="no">
        </iframe>

    </div>

</div>

<script>

function ajustarWidget() {

    const viewport = document.getElementById("viewport");
    const container = document.getElementById("zoom-container");

    const larguraTela = viewport.clientWidth;
    const alturaTela = viewport.clientHeight;

    const larguraWidget = 420;
    const alturaWidget = 210;

    /*
    Calcula a escala máxima que cabe
    completamente dentro da tela.
    */

    let escalaLargura = larguraTela / larguraWidget;
    let escalaAltura = alturaTela / alturaWidget;

    let escala = Math.min(
        escalaLargura,
        escalaAltura
    );

    /*
    Reduz um pouco para garantir que
    nada fique encostado nas bordas.
    */

    escala = escala * 0.85;

    /*
    Aplica a escala.
    */

    container.style.transform =
        `scale(${escala})`;
}

ajustarWidget();

window.addEventListener(
    "resize",
    ajustarWidget
);

</script>

</body>
</html>
