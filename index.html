<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Econômicos</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1c3d;
}

#viewport {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#widget {
    width: 420px;
    height: 210px;

    border: 0;

    display: block;

    /*
    AUMENTE OU DIMINUA ESTE VALOR
    conforme o tamanho desejado.
    */
    zoom: 2;
}

</style>

</head>

<body>

<div id="viewport">

    <iframe
        id="widget"
        src="https://valorfinal.com.br/embed/indicadores?theme=dark"
        title="Indicadores econômicos hoje - ValorFinal"
        frameborder="0"
        scrolling="no">
    </iframe>

</div>

</body>
</html>
