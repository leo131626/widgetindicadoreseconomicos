<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indicadores Econômicos</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1c3d;
}

#viewport {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

#widget-wrapper {

    /*
    Área REAL do iframe.
    Deixamos maior para evitar o corte.
    */
    width: 840px;
    height: 420px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;
}

iframe {

    width: 840px;
    height: 420px;

    border: 0;

    display: block;

    margin: 0;
    padding: 0;
}

</style>

</head>

<body>

<div id="viewport">

    <div id="widget-wrapper">

        <iframe
            src="https://valorfinal.com.br/embed/indicadores?theme=dark"
            title="Indicadores econômicos hoje - ValorFinal"
            frameborder="0"
            scrolling="no">
        </iframe>

    </div>

</div>

</body>
</html>
